name = "series-and-movies-for-my-love"
main = "worker/index.js"
compatibility_date = "2025-09-01"

# El frontend (React compilado en dist/) lo sirve el mismo Worker.
# /api/* y /media/* pasan primero por el código del Worker.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/media/*"]

# Base de datos (usuarios, catálogo, progreso)
[[d1_databases]]
binding = "DB"
database_name = "smfml-db"
database_id = "REEMPLAZA_CON_TU_DATABASE_ID"

# Bucket privado con tus películas en HLS
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "smfml-videos"

[vars]
# Duración de la sesión (días) y de cada URL firmada de video (horas)
SESSION_DAYS = "30"
MEDIA_TOKEN_HOURS = "6"
# El secreto NO va aquí: se configura con  npx wrangler secret put AUTH_SECRET
